<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배경 제거</title>
<style>
  :root { --accent: #6c5ce7; --bg: #f7f7fb; --text: #1f1f2e; --muted: #6b6b80; --card: #fff; --border: #e3e3ee; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 960px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  h1 { font-size: clamp(28px, 5vw, 40px); margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 32px; }
  .drop { display: block; background: var(--card); border: 2px dashed var(--border); border-radius: 20px; padding: 56px 16px; cursor: pointer; transition: .15s; }
  .drop.over, .drop:hover { border-color: var(--accent); background: #f3f1ff; }
  .btn { display: inline-block; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; text-decoration: none; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .hint { color: var(--muted); font-size: 14px; margin-top: 12px; }
  .result { display: none; gap: 16px; grid-template-columns: 1fr 1fr; margin-top: 8px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px; }
  .panel p { margin: 0 0 8px; font-weight: 600; color: var(--muted); font-size: 14px; }
  .frame { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 10px; overflow: hidden; position: relative;
    background: repeating-conic-gradient(#e6e6e6 0 25%, #fff 0 50%) 0 0 / 20px 20px; }
  .frame.plain { background: #f0f0f4; }
  .frame img { max-width: 100%; max-height: 100%; }
  .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .actions { display: none; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  .error { color: #d63031; margin-top: 16px; }
  @media (max-width: 600px) { .result { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>이미지 배경 제거</h1>
  <p class="sub">이미지를 올리면 AI가 배경을 투명하게 지워 드려요.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
    <span class="btn">이미지 업로드</span>
    <div class="hint">또는 파일을 여기로 끌어다 놓으세요 · PNG, JPEG, WEBP · 최대 20MB</div>
  </label>

  <div class="result" id="result">
    <div class="panel"><p>원본</p><div class="frame plain"><img id="before" alt="원본"></div></div>
    <div class="panel"><p>배경 제거</p><div class="frame" id="afterFrame"><img id="after" alt="결과"></div></div>
  </div>

  <div class="error" id="error"></div>

  <div class="actions" id="actions">
    <a class="btn" id="download" download>PNG 다운로드</a>
    <button class="btn ghost" id="again">다른 이미지</button>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
